overrides:
  # ONE Nuxt kit/schema for the whole tree. @mono-lit/* ask for `^4.6.2`, which pnpm may
  # satisfy with an older copy beside nuxt's own; two schemas resolve devServer.host to {}
  # and `nuxt dev` crashes (options.hostname.toLowerCase is not a function). Keep = catalog nuxt.
  '@nuxt/kit': 4.6.4
  '@nuxt/schema': 4.6.4

packages:
  - nuxt-host
  - nuxt-remote
  - vue-host
  - vue-remote

# Catalogs — the single source of truth for shared dependency versions
# across all templates (templates reference these as "catalog:<name>").
# The 'mono' catalog pins the public @mono-lit/* packages on npmjs.
catalogs:
  build:
    '@odata2ts/http-client-api': ^0.7.1
    '@odata2ts/odata-query-objects': ^0.32.0
    '@odata2ts/odata-service': ^0.28.0
    '@odata2ts/odata2ts': ^0.45.0
    '@sentry/vite-plugin': ^11.12.0
    '@vitejs/plugin-vue': ^6.0.11
    unocss: 66.12.0
    unplugin-auto-import: ^21.1.0
    unplugin-vue-components: ^32.1.0
    vite: 8.3.8
    vite-plugin-mkcert: ^2.1.0
    vite-plugin-vue-devtools: ^8.2.1
    vite-plugin-vue-layouts-next: ^3.3.1
  dev:
    '@iconify/json': ^2.2.556
    '@tsconfig/node22': ^22.0.7
    '@vue/tsconfig': ^0.9.1
    dotenv: ^18.0.10
    dotenv-cli: ^11.1.0
    taze: ^21.3.0
    typescript: ~7.0.2
    vue-tsc: ^3.3.14
  frontend:
    '@sentry/nuxt': ^11.12.0
    '@sentry/vue': ^11.12.0
    '@unhead/vue': 3.4.3
    '@vueuse/core': 15.0.0
    '@vueuse/integrations': 15.0.0
    jwt-decode: ^4.0.0
    notivue: ^2.4.5
    pinia: 4.1.0
    universal-cookie: ^8.1.2
    vue: 3.5.45
    vue-router: 5.5.0
    yup: 1.7.1
  mono:
    '@mono-lit/devextreme': 0.0.2
    '@mono-lit/helper': 0.0.10
    '@mono-lit/utility': 0.0.6
  nuxt:
    '@pinia/nuxt': 1.0.3
    '@unocss/nuxt': 66.12.0
    '@vueuse/nuxt': 15.0.0
    nuxt: 4.6.4
  types:
    '@types/node': ^26.6.6
