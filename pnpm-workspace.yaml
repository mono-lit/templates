packages:
  - nuxt-host
  - nuxt-remote
  - vue-host
  - vue-remote

# Catalogs — the single source of truth for shared dependency versions
# across all templates (templates reference these as "catalog:<name>").
# The 'internal' catalog serves the mono libraries from the private
# registry https://mono-libs.netlify.app/npm/ (see root .npmrc) —
# previously these were git+token installs.
catalogs:
  build:
    '@odata2ts/http-client-api': ^0.6.3
    '@odata2ts/odata-query-objects': ^0.28.1
    '@odata2ts/odata-service': ^0.23.1
    '@odata2ts/odata2ts': ^0.40.1
    '@sentry/vite-plugin': ^5.3.0
    '@vitejs/plugin-vue': ^6.0.7
    unocss: ^66.7.0
    unplugin-auto-import: ^21.0.0
    unplugin-vue-components: ^32.1.0
    vite: 8.1.4
    vite-plugin-mkcert: ^2.1.0
    vite-plugin-vue-devtools: ^8.1.2
    vite-plugin-vue-layouts-next: ^2.1.0
  dev:
    '@iconify/json': ^2.2.483
    '@tsconfig/node22': ^22.0.5
    '@vue/tsconfig': ^0.9.1
    dotenv: ^17.4.2
    dotenv-cli: ^11.0.0
    taze: ^19.14.1
    typescript: ~6.0.3
    vue-tsc: ^3.3.3
  frontend:
    '@sentry/integrations': ^7.114.0
    '@sentry/nuxt': ^10.66.0
    '@sentry/vue': ^10.56.0
    '@unhead/vue': 3.1.3
    '@vueuse/core': 14.3.0
    '@vueuse/integrations': 14.3.0
    jwt-decode: ^4.0.0
    notivue: ^2.4.5
    pinia: 3.0.4
    universal-cookie: ^8.1.2
    vue: 3.5.24
    vue-router: 5.0.4
    yup: 1.7.1
  mono:
    mono-devextreme: ^0.0.1
    mono-helper: ^0.0.1
    mono-utils: ^0.0.2
  nuxt:
    '@pinia/nuxt': ^1.0.1
    '@unocss/nuxt': ^66.7.5
    '@vueuse/nuxt': 14.3.0
    nuxt: 4.5.0
  types:
    '@types/node': ^25.9.2
