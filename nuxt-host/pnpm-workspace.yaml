shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1

overrides:
  nanoid@^3: 3.3.16

packages: []

catalogs:
  # Internal EJI-ICT libraries (private registry https://mono-libs.netlify.app/npm/, token in .npmrc)
  mono:
    mono-devextreme: ^0.0.1
    mono-helper: ^0.0.1
    mono-utils: ^0.0.2

  # Nuxt framework + Nuxt modules
  nuxt:
    # EXACT, not a range. `mono-utils` is compiled against @nuxt/kit and
    # @nuxt/schema 4.5.0, and its Nuxt module reaches into internals a patch
    # release is free to change: it appends to `nuxt.options._layers` to
    # register a federated Nuxt app as a native layer, which relies on Nuxt
    # still reading `_layers` lazily on `app:resolve`. A floating `^4.5.0`
    # silently put a FRESH install on 4.5.2 while an existing lockfile stayed
    # on 4.5.0 - two checkouts of one template running different Nuxt.
    # Bump this and mono-utils devDependencies together.
    nuxt: 4.5.0
    # Build-time module API. Same version as Nuxt so pnpm dedupes to one copy:
    # @nuxt/kit keeps the active Nuxt instance in a module-level global, so a
    # second copy makes `useNuxt()` come back empty inside a module.
    "@nuxt/kit": 4.5.0
    "@pinia/nuxt": ^1.0.1
    "@unocss/nuxt": ^66.7.5
    "@vueuse/nuxt": 14.3.0

  # Build pipeline: bundler plugins and codegen tooling
  build:
    "@odata2ts/http-client-api": ^0.6.5
    "@odata2ts/odata-query-objects": ^0.28.2
    "@odata2ts/odata-service": ^0.23.2
    "@odata2ts/odata2ts": ^0.40.2
    unocss: ^66.7.5

  # Dev tooling: type-checking and env helpers
  dev:
    "@iconify/json": ^2.2.501
    dotenv: ^17.4.2
    dotenv-cli: ^11.0.0
    # Stay on the classic (JS-based) TypeScript. 7.0.x is the native Go port,
    # which drops the programmatic compiler API (`findConfigFile`, `sys`,
    # `parseJsonConfigFileContent`) that `@vue/compiler-sfc` needs to resolve
    # imported types in `defineProps<T>()` (e.g. the federated flow-app's
    # `defineProps<NodeProps>()` from @vue-flow/core) and that `vue-tsc` needs
    # to type-check. On 7.0.2 the /flow build fails with "No fs option provided
    # to compileScript" then "ts.findConfigFile is not a function". Revert only
    # when compiler-sfc/vue-tsc officially support the native port.
    typescript: ~6.0.3
    vue-tsc: ^3.3.7
    taze: ^19.14.1

  # Frontend runtime: shipped to the browser bundle
  frontend:
    "@sentry/nuxt": ^10.66.0
    "@unhead/vue": 3.1.3
    "@vueuse/core": 14.3.0
    "@vueuse/integrations": 14.3.0
    jwt-decode: ^4.0.0
    notivue: ^2.4.5
    pinia: 3.0.4
    universal-cookie: ^8.1.2
    vue: 3.5.24
    vue-router: ^5.2.0
    yup: 1.7.1
    
  # Type definitions
  types:
    "@types/node": ^26.1.1

onlyBuiltDependencies:
  - esbuild

allowBuilds:
  '@sentry/cli': false
  core-js: false
  esbuild: false
  inferno: false