# Mono-lith root workspace: the ONLY workspace file and the only lockfile.
# One install here hoists every shared dependency to one store, so the host
# compiling a sibling's files resolves the SAME vue / pinia / @mono-lit/helper
# the sibling would. Generated by mono-templates/scripts/make-liths.mjs.
shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  # seroval@1.7.2 (via nuxt -> @nuxt/vite-builder) was published with weaker provenance than an
  # earlier release, which no-downgrade blocks as a possible takeover. Exempted by exact version only.
  - seroval@1.7.2
  # Old 2023 release, published before npm provenance existed; newer semver releases have it.
  - semver@6.3.1
  # vite-plus 1.8.0's type-aware lint backend (pinned exactly by vite-plus). An earlier
  # `0.0.0-bootstrap.0` placeholder was a staged publish, which pnpm ranks higher, so each real
  # release reads as a "downgrade" (oxc-project/tsrs#945). Move this pin with vite-plus.
  - tsrs@7.1.0-beta.tsrs4

# Release-age gate disabled: any version installs as soon as it is published.
minimumReleaseAge: 0

overrides:
  nanoid@^3: 3.3.16
  # Pin Vite for the whole tree: Nuxt itself only asks for `^8.3.4`.
  vite: 8.3.8
  # ONE Nuxt kit/schema for the whole tree. @mono-lit/* ask for a `^4.x` range, which pnpm may
  # satisfy with an older copy beside nuxt's own; two schemas resolve devServer.host to {}
  # and `nuxt dev` crashes (options.hostname.toLowerCase is not a function).
  # Points at the `nuxt` catalog, so bumping nuxt there moves these too.
  '@nuxt/kit': 'catalog:nuxt'
  '@nuxt/schema': 'catalog:nuxt'

packages:
  - apps/*

catalogs:
  build:
    '@odata2ts/http-client-api': ^0.7.1
    '@odata2ts/odata-query-objects': ^0.32.0
    '@odata2ts/odata-service': ^0.28.0
    '@odata2ts/odata2ts': ^0.45.0
    '@sentry/vite-plugin': ^11.12.0
    '@vitejs/plugin-vue': ^6.0.11
    unocss: 66.13.0
    unplugin-auto-import: ^21.1.0
    unplugin-vue-components: ^32.1.0
    vite: 8.3.8
    vite-plugin-mkcert: ^2.1.0
    vite-plugin-vue-devtools: ^8.2.1
    vite-plugin-vue-layouts-next: ^3.3.1
  dev:
    '@iconify/json': ^2.2.556
    '@tsconfig/node22': ^22.0.7
    '@vue/tsconfig': ^0.9.1
    dotenv: ^18.0.10
    dotenv-cli: ^11.1.0
    taze: ^21.3.0
    typescript: ~7.0.2
    vue-tsc: ^3.3.14
  frontend:
    '@sentry/nuxt': ^11.17.0
    '@sentry/vue': ^11.17.0
    '@unhead/vue': 3.4.3
    '@vueuse/core': 15.1.0
    '@vueuse/integrations': 15.1.0
    jwt-decode: ^4.0.0
    notivue: ^2.4.5
    pinia: 4.1.0
    universal-cookie: ^8.1.2
    valibot: 1.5.0
    vue: 3.5.46
    vue-router: 5.5.1
  mono:
    '@mono-lit/devextreme': 0.0.2
    '@mono-lit/helper': 0.1.6
    '@mono-lit/utility': 0.1.0
  # Bump nuxt, @nuxt/kit and @nuxt/schema together (the overrides above point here).
  nuxt:
    '@nuxt/kit': 4.7.0
    '@nuxt/schema': 4.7.0
    '@pinia/nuxt': 1.0.3
    '@unocss/nuxt': 66.13.0
    '@vueuse/nuxt': 15.1.0
    nuxt: 4.7.0
  types:
    '@types/node': ^26.6.6

# pnpm 12 replaced `onlyBuiltDependencies` with `allowBuilds`: every package with an install
# script must be listed, true = run it, false = skip it silently.
allowBuilds:
  '@sentry/cli': false
  core-js: false
  esbuild: true
  inferno: false
