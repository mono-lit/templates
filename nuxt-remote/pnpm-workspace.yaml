shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1

overrides:
  nanoid@^3: 3.3.16
  # Pin Vite for the whole tree: Nuxt itself only asks for `^8.3.4`.
  vite: 8.3.4

packages: []

catalogs:
  # The mono libraries — public releases on npmjs (https://www.npmjs.com/org/mono-lit); no registry or token in .npmrc
  mono:
    '@mono-lit/devextreme': 0.0.2
    '@mono-lit/helper': 0.0.6
    '@mono-lit/utility': 0.0.5

  # Nuxt framework + Nuxt modules
  nuxt:
    # EXACT, not a range. `@mono-lit/utility`'s Nuxt module reaches into internals a
    # patch release is free to change: it appends to `nuxt.options._layers` to
    # register a federated Nuxt app as a native layer, which relies on Nuxt still
    # reading `_layers` lazily on `app:resolve`. A floating range would put a FRESH
    # install on a newer patch while an existing lockfile stays put - two checkouts
    # of one template running different Nuxt. @nuxt/kit / @nuxt/schema need no pin
    # or override: @mono-lit/* depend on `^4.6.2` themselves, so keep `nuxt` on the
    # newest 4.6.x patch and pnpm resolves ONE kit for Nuxt and the libraries.
    nuxt: 4.6.2
    "@pinia/nuxt": 1.0.3
    "@unocss/nuxt": 66.11.0
    "@vueuse/nuxt": 14.3.0

  # Build pipeline: bundler plugins and codegen tooling
  build:
    "@odata2ts/http-client-api": ^0.6.5
    "@odata2ts/odata-query-objects": ^0.28.2
    "@odata2ts/odata-service": ^0.23.2
    "@odata2ts/odata2ts": ^0.40.2
    unocss: 66.11.0

  # Dev tooling: type-checking and env helpers
  dev:
    "@iconify/json": ^2.2.501
    dotenv: ^17.4.2
    dotenv-cli: ^11.0.0
    # Stay on the classic (JS-based) TypeScript. 7.0.x is the native Go port,
    # which drops the programmatic compiler API (`findConfigFile`, `sys`,
    # `parseJsonConfigFileContent`) that `@vue/compiler-sfc` needs to resolve
    # imported types in `defineProps<T>()` (e.g. the federated flow-app's
    # `defineProps<NodeProps>()` from @vue-flow/core) and that `vue-tsc` needs
    # to type-check. On 7.0.2 the /flow build fails with "No fs option provided
    # to compileScript" then "ts.findConfigFile is not a function". Revert only
    # when compiler-sfc/vue-tsc officially support the native port.
    typescript: ~6.0.3
    vue-tsc: ^3.3.13
    taze: ^19.14.1

  # Frontend runtime: shipped to the browser bundle
  frontend:
    "@unhead/vue": 3.1.3
    "@vueuse/core": 14.3.0
    "@vueuse/integrations": 14.3.0
    jwt-decode: ^4.0.0
    notivue: ^2.4.5
    pinia: 4.1.0
    universal-cookie: ^8.1.2
    vue: 3.5.44
    vue-router: 5.4.0
    yup: 1.7.1

  # Type definitions
  types:
    "@types/node": ^26.1.1

onlyBuiltDependencies:
  - esbuild

allowBuilds:
  core-js: false
  esbuild: false
  inferno: false